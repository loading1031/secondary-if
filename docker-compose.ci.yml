services:
  mydb:
    container_name: mydb
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydb
    ports:
      - 3306:3306
    networks:
      - network

  neodb:
    build:
      context: ./neodb
      dockerfile: Dockerfile
    ports:
      - 7687:7687
      - 7474:7474
      - 7473:7473
    networks:
      - network

  redis:
    container_name: redis
    image: redis:latest
    restart: always
    ports: # 포트포워딩 - 로컬의 호스트가 6379 포트를 사용 중일 수 있으므로 6379 포트를 도커 컨테이너의 6379 포트로 포워딩해줌
      - "6379:6379"
    networks:
      - network  # 네트워크 추가
  backend:
    image: "${DOCKER_USERNAME}/backend:cloud-native"
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    ports:
      - 8080:8080
    depends_on:
      - mydb
      - neodb
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mydb:3306/mydb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false
      SPRING_DATASOURCE_DRIVER: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      SPRING_NEO4J_URI: bolt://neodb:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: root1234
    networks:
      - network

  frontend:
    image: "${DOCKER_USERNAME}/frontend:cloud-native"
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: always
    ports:
      - 80:80
    depends_on:
      - backend
    networks:
      - network
networks:
  network: